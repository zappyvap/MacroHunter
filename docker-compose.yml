name: macrohunter-backend

services:
  # main engine logic
  engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: uvicorn engine:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./mcp_servers:/app/mcp_servers
    env_file:
      - .env
  # upload menu
  scanner:
    build:
      context: ./mcp_servers
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    command: uvicorn image_scraper:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./mcp_servers:/app
    env_file:
      - .env

  expo-app:
    build:
      context: ./macrohunter-frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    tty: true
    stdin_open: true
    environment:
      # Reads from .env (HOST_IP) or falls back to 10.0.0.241
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-10.0.0.241}
      - EXPO_PUBLIC_HOST_IP=${HOST_IP:-10.0.0.241}
      # Enables polling so file changes on the host sync inside the container for Fast Refresh
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./macrohunter-frontend:/app
      - /app/node_modules
    env_file:
      - .env

    